[project]
name = "copra-grading"
version = "0.1.0"
description = "Copra classification pipeline, classes A-F (image feature extraction + tree-ensemble classification)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "numba>=0.59",
    "llvmlite>=0.42",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copra_grading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
